name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p profile

          gh api graphql \
            -f login='Ahmedvini' \
            -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions} totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions}}}' \
            > /tmp/github.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.load(open('/tmp/github.json'))

          if data.get("errors"):
              raise SystemExit(json.dumps(data["errors"], indent=2))

          c = data["data"]["user"]["contributionsCollection"]

          total = c["contributionCalendar"]["totalContributions"]
          commits = c["totalCommitContributions"]
          prs = c["totalPullRequestContributions"]
          issues = c["totalIssueContributions"]
          reviews = c["totalPullRequestReviewContributions"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="230"
          viewBox="0 0 900 230">

            <rect width="900" height="230" rx="14" fill="#161b22"/>

            <text x="40" y="48"
              fill="#58a6ff"
              font-family="Arial,sans-serif"
              font-size="25"
              font-weight="700">
              Ahmed Elsheikh's GitHub
            </text>

            <text x="40" y="75"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="14">
              Contribution activity · updated automatically
            </text>

            <line x1="40" y1="95"
              x2="860" y2="95"
              stroke="#30363d"/>

            <text x="65" y="135"
              fill="#58a6ff"
              font-family="Arial,sans-serif"
              font-size="28"
              font-weight="700">
              {total:,}
            </text>

            <text x="65" y="158"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="13">
              Contributions
            </text>

            <text x="260" y="135"
              fill="#58a6ff"
              font-family="Arial,sans-serif"
              font-size="28"
              font-weight="700">
              {commits:,}
            </text>

            <text x="260" y="158"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="13">
              Commits
            </text>

            <text x="450" y="135"
              fill="#58a6ff"
              font-family="Arial,sans-serif"
              font-size="28"
              font-weight="700">
              {prs:,}
            </text>

            <text x="450" y="158"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="13">
              Pull Requests
            </text>

            <text x="640" y="135"
              fill="#58a6ff"
              font-family="Arial,sans-serif"
              font-size="28"
              font-weight="700">
              {issues:,}
            </text>

            <text x="640" y="158"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="13">
              Issues
            </text>

            <text x="65" y="195"
              fill="#8b949e"
              font-family="Arial,sans-serif"
              font-size="13">
              {reviews:,} pull-request reviews
            </text>

          </svg>'''

          Path("profile/stats.svg").write_text(svg, encoding="utf-8")

          print(
              f"Generated: {total} contributions | "
              f"{commits} commits | "
              f"{prs} PRs | "
              f"{issues} issues | "
              f"{reviews} reviews"
          )
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi