name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Ahmedvini
        run: |
          mkdir -p profile

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }

                totalCommitContributions
                restrictedContributionsCount
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }

              repositories(
                first: 100
                ownerAffiliations: OWNER
                privacy: PUBLIC
              ) {
                totalCount
              }

              followers {
                totalCount
              }

              starredRepositories {
                totalCount
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-profile-stats"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if "errors" in data:
              raise RuntimeError(json.dumps(data["errors"], indent=2))

          user = data["data"]["user"]
          contributions = user["contributionsCollection"]

          calendar = contributions["contributionCalendar"]

          total = calendar["totalContributions"]
          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          prs = contributions["totalPullRequestContributions"]
          reviews = contributions["totalPullRequestReviewContributions"]

          stars = user["starredRepositories"]["totalCount"]
          repos = user["repositories"]["totalCount"]
          followers = user["followers"]["totalCount"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="900"
            height="260"
            viewBox="0 0 900 260">

            <defs>
              <linearGradient id="bg" x1="0" x2="1">
                <stop offset="0%" stop-color="#161b22"/>
                <stop offset="100%" stop-color="#1f2430"/>
              </linearGradient>
            </defs>

            <rect width="900" height="260" rx="14" fill="url(#bg)"/>

            <text x="40" y="52"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="26"
              font-weight="700">
              Ahmed Elsheikh's GitHub
            </text>

            <text x="40" y="82"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="15">
              GitHub activity and contribution overview
            </text>

            <line x1="40" y1="105" x2="860" y2="105"
              stroke="#30363d"/>

            <text x="65" y="145"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="28"
              font-weight="700">
              {total:,}
            </text>

            <text x="65" y="170"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="14">
              Contributions
            </text>

            <text x="250" y="145"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="28"
              font-weight="700">
              {commits:,}
            </text>

            <text x="250" y="170"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="14">
              Commits
            </text>

            <text x="435" y="145"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="28"
              font-weight="700">
              {prs:,}
            </text>

            <text x="435" y="170"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="14">
              Pull Requests
            </text>

            <text x="620" y="145"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="28"
              font-weight="700">
              {issues:,}
            </text>

            <text x="620" y="170"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="14">
              Issues
            </text>

            <text x="65" y="215"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              {reviews:,} PR reviews
            </text>

            <text x="250" y="215"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              {repos:,} public repositories
            </text>

            <text x="500" y="215"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              {followers:,} followers
            </text>

            <text x="700" y="215"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              {stars:,} starred repositories
            </text>

          </svg>
          '''

          with open("profile/stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print(f"Contributions: {total}")
          print(f"Commits: {commits}")
          print(f"PRs: {prs}")
          print(f"Issues: {issues}")
          print(f"Reviews: {reviews}")
          PY

      - name: Generate language statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Ahmedvini
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-profile-stats"
          }

          repos_url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&type=owner"
          )

          req = urllib.request.Request(repos_url, headers=headers)

          with urllib.request.urlopen(req) as response:
              repos = json.load(response)

          totals = Counter()

          for repo in repos:
              if repo.get("fork"):
                  continue

              url = repo["languages_url"]

              req = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(req) as response:
                      languages = json.load(response)

                  for language, amount in languages.items():
                      totals[language] += amount

              except Exception:
                  continue

          total_bytes = sum(totals.values())

          languages = totals.most_common(8)

          rows = []

          for language, amount in languages:
              percentage = (
                  amount / total_bytes * 100
                  if total_bytes
                  else 0
              )

              rows.append(
                  f"{language}: {percentage:.1f}%"
              )

          print("Language distribution:")
          for row in rows:
              print(row)

          with open("profile/languages.txt", "w") as f:
              f.write("\n".join(rows))
          PY

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi